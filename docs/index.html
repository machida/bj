<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackjack — Spinel + WASM</title>
<style>
/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Georgia', serif;
  background: radial-gradient(ellipse at center, #1a4a2e 0%, #0d2b1a 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #f0e6c8;
  padding: 1rem;
  user-select: none;
}

h1 {
  font-size: 2rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #ffd700;
  text-shadow: 0 2px 8px rgba(0,0,0,.6);
  margin-bottom: 0.3rem;
}

.subtitle {
  font-size: 0.75rem;
  color: #aaa;
  letter-spacing: 0.2em;
  margin-bottom: 1.5rem;
}

/* ── Table ── */
.table {
  background: radial-gradient(ellipse at center, #235c37 0%, #1a4429 100%);
  border: 4px solid #8b7536;
  border-radius: 200px / 80px;
  padding: 2rem 3rem;
  width: min(700px, 98vw);
  box-shadow:
    0 0 0 8px #6b5a2a,
    0 8px 40px rgba(0,0,0,.8),
    inset 0 0 60px rgba(0,0,0,.3);
  position: relative;
}

/* ── Zones ── */
.zone { margin-bottom: 1.2rem; }

.zone-label {
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-bottom: 0.4rem;
}

.score-badge {
  display: inline-block;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  padding: 1px 8px;
  font-size: 0.85rem;
  color: #ffd700;
  margin-left: 0.5rem;
  min-width: 1.8rem;
  text-align: center;
}

.hand {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  min-height: 120px;
  align-items: flex-start;
}

/* ── Cards ── */
.card {
  width: 72px;
  height: 108px;
  background: #fff;
  border-radius: 8px;
  box-shadow: 2px 3px 8px rgba(0,0,0,.5);
  position: relative;
  flex-shrink: 0;
  animation: dealCard 0.3s ease both;
}

@keyframes dealCard {
  from { transform: translateY(-30px) rotate(-5deg); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

.card-hidden {
  background: linear-gradient(135deg, #1a237e 25%, #283593 75%);
  background-size: 8px 8px;
}

.card-back {
  width: 100%;
  height: 100%;
  border-radius: 8px;
  background:
    repeating-linear-gradient(45deg, #1565c0 0, #1565c0 2px, #0d47a1 2px, #0d47a1 8px);
  border: 3px solid #fff;
}

.card-corner {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  font-size: 0.8rem;
  font-weight: bold;
}

.card-corner.top { top: 4px; left: 6px; }
.card-corner.bot { bottom: 4px; right: 6px; transform: rotate(180deg); }

.card-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 1.6rem;
}

.card-red  .card-corner,
.card-red  .card-center { color: #c62828; }

.card-black .card-corner,
.card-black .card-center { color: #1a1a1a; }

/* ── Divider ── */
.divider {
  border: none;
  border-top: 1px dashed rgba(255,255,255,0.2);
  margin: 1rem 0;
}

/* ── Info bar ── */
.info-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.9rem;
  margin-bottom: 0.8rem;
}

.chip-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.chip-label {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
}

.chip-value {
  font-size: 1.3rem;
  color: #ffd700;
  font-weight: bold;
  text-shadow: 0 1px 4px rgba(0,0,0,.5);
}

.chip-value::before { content: '$'; font-size: 0.9rem; }

/* ── Bet controls ── */
.bet-controls {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.btn-sm {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.btn-sm:hover:not(:disabled) { background: rgba(255,255,255,0.25); }
.btn-sm:disabled { opacity: 0.4; cursor: default; }

/* ── Message ── */
.message {
  text-align: center;
  font-size: 1rem;
  min-height: 1.4rem;
  color: #f0e6c8;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}
.message.win, .message.blackjack { color: #69f0ae; }
.message.lose, .message.bust     { color: #ef9a9a; }
.message.push                    { color: #ffe082; }

/* ── Action buttons ── */
.actions {
  display: flex;
  gap: 0.8rem;
  justify-content: center;
  margin-top: 1rem;
}

.btn {
  padding: 0.65rem 1.8rem;
  border-radius: 6px;
  border: none;
  font-size: 1rem;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: transform 0.1s, box-shadow 0.1s;
  box-shadow: 0 3px 6px rgba(0,0,0,.4);
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.btn:disabled { opacity: 0.5; cursor: default; }

.btn-deal {
  background: linear-gradient(135deg, #ffd700, #ffb300);
  color: #1a1a00;
  font-weight: bold;
}
.btn-deal:hover:not(:disabled) { background: linear-gradient(135deg, #ffe033, #ffc107); }

.btn-hit {
  background: linear-gradient(135deg, #43a047, #2e7d32);
  color: #fff;
  font-weight: bold;
}
.btn-hit:hover:not(:disabled) { background: linear-gradient(135deg, #4caf50, #388e3c); }

.btn-stand {
  background: linear-gradient(135deg, #e53935, #b71c1c);
  color: #fff;
  font-weight: bold;
}
.btn-stand:hover:not(:disabled) { background: linear-gradient(135deg, #ef5350, #c62828); }

.btn-reset {
  background: linear-gradient(135deg, #546e7a, #37474f);
  color: #fff;
  font-size: 0.85rem;
}

/* ── Result overlay ── */
.result-overlay {
  position: absolute;
  inset: 0;
  border-radius: 200px / 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(2px);
}
.result-overlay.show {
  opacity: 1;
  pointer-events: none;
}

.result-text {
  font-size: 3rem;
  font-weight: bold;
  text-shadow: 0 2px 12px rgba(0,0,0,.8);
  letter-spacing: 0.1em;
}
.result-sub {
  font-size: 1rem;
  margin-top: 0.4rem;
  color: rgba(255,255,255,0.8);
}

.result-overlay.win .result-text,
.result-overlay.blackjack .result-text { color: #69f0ae; }
.result-overlay.lose .result-text,
.result-overlay.bust .result-text      { color: #ef9a9a; }
.result-overlay.push .result-text      { color: #ffe082; }

/* ── Loading ── */
#loading {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  gap: 1rem;
}
.spinner {
  width: 48px; height: 48px;
  border: 5px solid rgba(255,215,0,0.2);
  border-top-color: #ffd700;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { color: #aaa; font-size: 0.85rem; letter-spacing: 0.15em; }

/* ── Footer ── */
footer {
  margin-top: 1.2rem;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.15em;
  text-align: center;
}
footer a { color: rgba(255,215,0,0.5); text-decoration: none; }
</style>
</head>
<body>

<h1>Blackjack</h1>
<p class="subtitle">Spinel AOT Compiler + WebAssembly</p>

<div class="table">
  <!-- Result flash -->
  <div id="result-overlay" class="result-overlay">
    <div class="result-text"></div>
    <div class="result-sub"></div>
  </div>

  <!-- Dealer -->
  <div class="zone">
    <div class="zone-label">
      Dealer
      <span class="score-badge" id="dealer-score"></span>
    </div>
    <div class="hand" id="dealer-cards"></div>
  </div>

  <hr class="divider">

  <!-- Info bar -->
  <div class="info-bar">
    <div class="chip-display">
      <span class="chip-label">Chips</span>
      <span class="chip-value" id="chips-display">1000</span>
    </div>

    <p class="message" id="message">Press Deal to play</p>

    <div class="chip-display">
      <span class="chip-label">Bet</span>
      <div class="bet-controls">
        <button class="btn-sm" id="btn-bet-dn">−</button>
        <span class="chip-value" id="bet-display">100</span>
        <button class="btn-sm" id="btn-bet-up">+</button>
      </div>
    </div>
  </div>

  <!-- Player -->
  <div class="zone">
    <div class="zone-label">
      Your Hand
      <span class="score-badge" id="player-score"></span>
    </div>
    <div class="hand" id="player-cards"></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-hit"   id="btn-hit"   style="display:none">Hit</button>
    <button class="btn btn-stand" id="btn-stand" style="display:none">Stand</button>
    <button class="btn btn-deal"  id="btn-deal">Deal</button>
    <button class="btn btn-reset" id="btn-reset" style="display:none">New Game ($1000)</button>
  </div>
</div>

<footer>
  Game logic: Ruby compiled with
  <a href="https://github.com/matz/spinel" target="_blank">Spinel AOT</a>
  → C → WebAssembly (Emscripten)
</footer>

<!-- Loading screen -->
<div id="loading">
  <div class="spinner"></div>
  <p>Loading WASM…</p>
</div>

<!-- Emscripten-generated WASM loader -->
<script src="blackjack.js"></script>
<!-- Game logic -->
<script src="game.js"></script>
</body>
</html>
